# Final version (Step 13): Deployment + NodePort Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: flask-app:latest
        imagePullPolicy: Never      # never pull from Docker Hub; use local image
        ports:
        - containerPort: 15000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
spec:
  selector:
    app: flask-app                # sends traffic to Pods with this label
  ports:
  - port: 15000                   # Service port
    targetPort: 15000             # container port Flask listens on
  type: NodePort
