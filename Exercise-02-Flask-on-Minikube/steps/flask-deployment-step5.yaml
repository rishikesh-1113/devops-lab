# Step 5 version: Deployment only (no Service).
# With this alone, curl http://127.0.0.1:15000 fails (Step 12),
# because the container port is not exposed outside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: flask-app:latest
        imagePullPolicy: Never      # use the image built inside Minikube's Docker
        ports:
        - containerPort: 15000
