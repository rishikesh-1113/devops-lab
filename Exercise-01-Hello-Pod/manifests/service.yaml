# Declarative equivalent of:
#   kubectl expose pod hello-k8s --type=NodePort --port=80
apiVersion: v1
kind: Service
metadata:
  name: hello-k8s
spec:
  type: NodePort
  selector:
    run: hello-k8s       # routes traffic to Pods carrying this label
  ports:
    - port: 80           # Service's own (ClusterIP) port
      targetPort: 80     # container port on the Pod
      protocol: TCP
      # nodePort is omitted: Kubernetes assigns one from 30000-32767
